name: Netgrade CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      # requirements-dev.txt, not requirements.txt: pytest lives there now, so
      # the runtime image does not carry the test suite's dependencies.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run pytest suite
      run: pytest -v

  image:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Deployment is a scored row and a broken image is only discovered at
    # deploy time otherwise. Building on every push makes that a CI failure
    # instead of a submission-day one.
    - name: Build the container image
      run: docker build -t netgrade:ci .

    - name: Check it starts and serves
      run: |
        docker run -d --name netgrade-ci -p 8000:8000 netgrade:ci
        for attempt in $(seq 1 20); do
          if curl -fsS http://127.0.0.1:8000/health; then
            echo "container healthy"
            docker rm -f netgrade-ci
            exit 0
          fi
          sleep 1
        done
        echo "container did not become healthy"
        docker logs netgrade-ci
        exit 1
