<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:
      radial-gradient(900px 500px at 88% 18%, rgba(6,182,212,0.16), transparent 65%),
      radial-gradient(700px 420px at 8% 92%, rgba(59,130,246,0.12), transparent 60%),
      #0b0f19;
    font-family: "Noto Sans","Liberation Sans",system-ui,sans-serif;
    color:#f9fafb; display:flex; flex-direction:column;
    padding:64px 72px; position:relative; overflow:hidden;
  }
  .rule { position:absolute; left:0; top:0; width:100%; height:5px;
          background:linear-gradient(90deg,#06b6d4,#3b82f6 55%,transparent); }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand svg { width:52px; height:52px; }
  .word { font-size:40px; font-weight:800; letter-spacing:-0.02em;
          background:linear-gradient(90deg,#f9fafb,#7dd3fc);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .row { display:flex; align-items:center; justify-content:space-between;
         flex:1; gap:56px; margin-top:34px; }
  h1 { font-size:63px; line-height:1.06; font-weight:800; letter-spacing:-0.035em; max-width:640px; }
  h1 .dim { color:#9ca3af; }
  .sub { margin-top:26px; font-size:25px; color:#9ca3af; line-height:1.45; max-width:600px; }
  .badge { width:250px; height:250px; border-radius:38px; flex-shrink:0;
           background:linear-gradient(135deg,#3b82f6,#2563eb);
           display:flex; align-items:center; justify-content:center;
           font-size:150px; font-weight:800; color:#fff;
           box-shadow:0 30px 80px rgba(37,99,235,0.42); }
  .badge-wrap { display:flex; flex-direction:column; align-items:center; gap:20px; }
  .score { font-size:31px; font-weight:700; color:#e5e7eb; letter-spacing:0.01em; }
  .score span { color:#9ca3af; font-weight:500; }
  .foot { display:flex; align-items:center; justify-content:space-between;
          border-top:1px solid #1f2937; padding-top:26px; }
  .chips { display:flex; gap:9px; }
  .chip { font-size:17px; color:#9ca3af; border:1px solid #1f2937;
          background:#111827; border-radius:999px; padding:7px 15px; }
  .host { font-size:22px; color:#06b6d4; font-weight:700; }
</style>
<div class="rule"></div>
<div class="brand">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs>
    <path d="M16 3L5 7V15C5 21.8 10 27.5 16 29C22 27.5 27 21.8 27 15V7L16 3Z" fill="url(#g)" fill-opacity="0.2" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M10 16.5L14 20.5L22 11" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="word">Netgrade</div>
</div>
<div class="row">
  <div>
    <h1>Security posture,<br><span class="dim">in plain language.</span></h1>
    <p class="sub">Seven passive checks. A score out of 100. Fixes an owner can act on &mdash; nothing intrusive, ever.</p>
  </div>
  <div class="badge-wrap">
    <div class="badge">B</div>
    <div class="score">82 <span>/ 100</span></div>
  </div>
</div>
<div class="foot">
  <div class="chips">
    <div class="chip">Email spoofing</div><div class="chip">TLS</div><div class="chip">Headers</div>
    <div class="chip">Cookies</div><div class="chip">Exposed files</div><div class="chip">DNS</div><div class="chip">Certificates</div>
  </div>
  <div class="host">netgrade.certifa.net</div>
</div>
